# Live deployment for the new x-hakt.com (Control Room tasks XH-4 / XH-8).
#
# Run as its own compose project so it never has to `up` the shared phase4 stack:
#
#   cd ~/unified-services
#   cp x-hakt-site/deploy/docker-compose.x-hakt-site.yml docker-compose.x-hakt-site.yml
#   # (edit build.context to ./x-hakt-site)
#   docker compose -f docker-compose.x-hakt-site.yml up -d --build
#
# The router priority (200) is above hugo-x-hakt's (100), so bringing this up
# takes x-hakt.com over immediately; `docker stop x-hakt-site` hands it straight
# back. Once verified, hugo-x-hakt is stopped and commented out of
# docker-compose.phase4.yml.

services:
  x-hakt-site:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: x-hakt-site
    restart: unless-stopped
    networks:
      - x_hakt_network
    labels:
      - traefik.enable=true
      - traefik.docker.network=unified-services_x-hakt-network
      # HTTP -> HTTPS
      - traefik.http.routers.x-hakt-site-insecure.rule=Host(`x-hakt.com`) || Host(`www.x-hakt.com`) || Host(`apex.x-hakt.com`)
      - traefik.http.routers.x-hakt-site-insecure.entrypoints=web
      - traefik.http.routers.x-hakt-site-insecure.middlewares=https-redirect@docker
      - traefik.http.routers.x-hakt-site-insecure.priority=200
      # HTTPS
      - traefik.http.routers.x-hakt-site.rule=Host(`x-hakt.com`) || Host(`www.x-hakt.com`) || Host(`apex.x-hakt.com`)
      - traefik.http.routers.x-hakt-site.entrypoints=websecure
      - traefik.http.routers.x-hakt-site.tls.certresolver=xhakt
      - traefik.http.routers.x-hakt-site.priority=200
      - traefik.http.services.x-hakt-site.loadbalancer.server.port=80

networks:
  x_hakt_network:
    external: true
    name: unified-services_x-hakt-network
