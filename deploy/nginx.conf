server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # the container listens on :80 but is published on another port / behind Traefik
  # on :443 — keep any redirect relative so it lands on the right origin.
  absolute_redirect off;

  # long-cache the fingerprinted build assets
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Astro emits pretty-URL directories: /about -> /about/index.html.
  # Resolve the index explicitly so a bare path serves straight through with no
  # redirect hop.
  location / {
    try_files $uri $uri/index.html $uri.html $uri/ @notfound;
  }

  # serve the 404 page but keep the 404 status code
  location @notfound {
    return 404;
  }
  error_page 404 /404.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript image/svg+xml application/xml application/rss+xml application/json;
}
